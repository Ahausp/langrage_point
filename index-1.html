<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sơ đồ Điểm Lagrange - Mayonaka Heart Tune</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* Khóa cứng khung hiển thị, cấm zoom/cuộn trang gây lệch layout Notion */
        html, body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            overflow: hidden !important;
            touch-action: manipulation;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            min-height: 650px;
        }

        #space-viewport {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 60%, #020617 100%);
        }

        /* Hiệu ứng nền sao */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #a5b4fc, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #ddd, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.3;
        }

        #orbit-system {
            position: absolute;
            top: 54%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 780px;
            height: 750px;
        }

        .orbit-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1.5px dashed rgba(165, 180, 252, 0.15);
            border-radius: 50%;
            pointer-events: none;
        }

        .lagrange-point {
            position: absolute;
            transform: translate(-50%, -50%);
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .char-card {
            cursor: grab;
            transition: all 0.2s ease;
            backdrop-filter: blur(8px);
        }

        .char-card:active {
            cursor: grabbing;
        }

        .char-card:hover {
            transform: scale(1.08) translateY(-2px);
            box-shadow: 0 12px 24px -5px rgba(236, 72, 153, 0.4);
        }

        /* Khi bấm chọn nhân vật trên di động */
        .selected-char {
            ring: 3px solid #ec4899;
            transform: scale(1.1) translateY(-3px);
            box-shadow: 0 0 15px #ec4899;
        }

        /* Hiệu ứng đường kết nối chuyển động dòng chảy */
        .animated-line {
            stroke-dasharray: 6 6;
            animation: dashFlow 25s linear infinite;
        }

        @keyframes dashFlow {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: -1000; }
        }

        /* Vùng thả Drag & Drop active */
        .drag-over {
            transform: translate(-50%, -50%) scale(1.25) !important;
            filter: drop-shadow(0 0 12px #ec4899);
        }

        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="select-none">

    <div id="space-viewport">
        <div class="stars"></div>

        <!-- Header Controls & Khay Nhân Vật -->
        <header class="absolute top-3 left-3 right-3 z-20 flex flex-wrap items-center justify-between gap-2 pointer-events-none">
            <div class="bg-slate-900/90 backdrop-blur-md border border-slate-700/60 p-2.5 rounded-2xl shadow-2xl pointer-events-auto flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center text-white text-base shadow-lg">
                    <i class="fa-solid fa-atom"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-sm tracking-wide bg-gradient-to-r from-pink-400 via-purple-300 to-indigo-300 bg-clip-text text-transparent">
                        MAYONAKA HEART TUNE
                    </h1>
                    <p class="text-[11px] text-slate-400 font-medium">Sơ đồ Cân bằng Quỹ đạo Lagrange</p>
                </div>
            </div>

            <!-- Khay kéo thả + Nút Khôi phục vị trí gốc -->
            <div class="bg-slate-900/90 backdrop-blur-md border border-slate-700/60 p-1.5 rounded-2xl shadow-2xl pointer-events-auto flex items-center gap-2">
                <div class="flex items-center gap-1.5" id="char-tray">
                    <!-- Javascript tự sinh icon nhân vật -->
                </div>

                <div class="h-5 w-px bg-slate-700/60 mx-0.5"></div>

                <button onclick="resetToDefault()" title="Khôi phục vị trí gốc" class="px-2.5 py-1 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-[11px] font-semibold flex items-center gap-1 transition-all">
                    <i class="fa-solid fa-rotate-left text-pink-400"></i>
                    <span class="hidden sm:inline">Gốc</span>
                </button>
            </div>
        </header>

        <!-- Orbit & Lagrange System -->
        <div id="orbit-system">
            <div class="orbit-ring" style="width: 500px; height: 500px;"></div>
            
            <!-- SVG MẠNG LƯỚI NỐI CÁC ĐIỂM LAGRANGE (CÓ CHUYỂN ĐỘNG) -->
            <svg class="absolute inset-0 w-full h-full pointer-events-none z-0">
                <line x1="125" y1="375" x2="500" y2="375" class="animated-line" stroke="rgba(236,72,153,0.5)" stroke-width="1.8" />
                <line x1="500" y1="375" x2="700" y2="375" class="animated-line" stroke="rgba(236,72,153,0.5)" stroke-width="1.8" />

                <line x1="500" y1="158" x2="500" y2="592" class="animated-line" stroke="rgba(236,72,153,0.5)" stroke-width="1.8" />

                <line x1="500" y1="158" x2="125" y2="375" class="animated-line" stroke="rgba(168,85,247,0.4)" stroke-width="1.5" />
                <line x1="500" y1="158" x2="700" y2="375" class="animated-line" stroke="rgba(168,85,247,0.4)" stroke-width="1.5" />

                <line x1="500" y1="592" x2="125" y2="375" class="animated-line" stroke="rgba(168,85,247,0.4)" stroke-width="1.5" />
                <line x1="500" y1="592" x2="700" y2="375" class="animated-line" stroke="rgba(168,85,247,0.4)" stroke-width="1.5" />
            </svg>

            <!-- 1. MẶT TRỜI (SUN) -->
            <div class="absolute top-1/2 left-[40px] -translate-x-1/2 -translate-y-1/2 z-10 text-center cursor-pointer" onclick="openDrawer(sunNode)">
                <div class="w-16 h-16 rounded-full bg-gradient-to-tr from-amber-500 via-orange-500 to-yellow-400 p-1 shadow-2xl shadow-orange-500/50 flex items-center justify-center mx-auto mb-1 animate-pulse">
                    <div class="w-full h-full rounded-full bg-slate-950 flex items-center justify-center">
                        <i class="fa-solid fa-sun text-2xl text-amber-400"></i>
                    </div>
                </div>
                <span class="bg-slate-900/90 border border-amber-500/40 text-amber-300 text-[10px] font-bold px-2 py-0.5 rounded-full shadow-md">
                    SUN
                </span>
            </div>

            <!-- 2. TRÁI ĐẤT (EARTH) -->
            <div class="absolute top-1/2 left-[375px] -translate-x-1/2 -translate-y-1/2 z-10 text-center cursor-pointer" onclick="openDrawer(earthNode)">
                <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-blue-600 via-indigo-600 to-cyan-400 p-1 shadow-2xl shadow-indigo-500/50 flex items-center justify-center mx-auto mb-1">
                    <div class="w-full h-full rounded-full bg-slate-950 flex items-center justify-center">
                        <i class="fa-solid fa-globe text-2xl text-cyan-400"></i>
                    </div>
                </div>
                <span class="bg-slate-900/90 border border-indigo-500/40 text-cyan-300 text-xs font-bold px-2.5 py-0.5 rounded-full shadow-md">
                    EARTH
                </span>
            </div>

            <!-- 3. MẶT TRĂNG (MOON) -->
            <div class="absolute top-1/2 left-[625px] -translate-x-1/2 -translate-y-1/2 z-10 text-center cursor-pointer" onclick="openDrawer(moonNode)">
                <div class="w-14 h-14 rounded-full bg-gradient-to-tr from-fuchsia-500 to-pink-500 p-0.5 shadow-xl shadow-pink-500/40 flex items-center justify-center mx-auto mb-1">
                    <div class="w-full h-full rounded-full bg-slate-950 flex items-center justify-center">
                        <i class="fa-solid fa-moon text-lg text-pink-400"></i>
                    </div>
                </div>
                <span class="bg-slate-900/90 border border-pink-500/40 text-pink-300 text-[11px] font-bold px-2 py-0.5 rounded-full">
                    MOON
                </span>
            </div>

            <!-- Các Điểm Lagrange L1 -> L5 -->
            <div id="L1" class="lagrange-point left-[500px] top-[375px]" onclick="handlePointClick('L1')" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'L1')"></div>
            <div id="L2" class="lagrange-point left-[700px] top-[375px]" onclick="handlePointClick('L2')" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'L2')"></div>
            <div id="L3" class="lagrange-point left-[125px] top-[375px]" onclick="handlePointClick('L3')" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'L3')"></div>
            <div id="L4" class="lagrange-point left-[500px] top-[158px]" onclick="handlePointClick('L4')" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'L4')"></div>
            <div id="L5" class="lagrange-point left-[500px] top-[592px]" onclick="handlePointClick('L5')" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'L5')"></div>
        </div>

        <!-- Lớp Phủ Mờ Backdrop (Bấm đâu cũng tắt bảng chi tiết) -->
        <div id="drawer-backdrop" onclick="closeDrawer()" class="fixed inset-0 bg-slate-950/50 backdrop-blur-[2px] z-40 hidden transition-opacity duration-300"></div>

        <!-- Detail Drawer Panel -->
        <div id="detail-drawer" class="fixed top-0 right-0 h-full w-full max-w-xs bg-slate-900/95 border-l border-slate-800 shadow-2xl z-50 transform translate-x-full transition-transform duration-300 ease-in-out backdrop-blur-xl flex flex-col p-5">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                <span id="drawer-point" class="text-xs font-bold uppercase px-2.5 py-1 rounded-full bg-pink-500/20 text-pink-400 border border-pink-500/30">L-Point</span>
                <button onclick="closeDrawer()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto custom-scroll">
                <div id="drawer-icon" class="w-14 h-14 rounded-2xl mb-3 flex items-center justify-center text-xl text-white shadow-lg"></div>
                <h2 id="drawer-title" class="text-xl font-bold text-white">Title</h2>
                <p id="drawer-subtitle" class="text-xs font-semibold text-pink-400 mb-3">Subtitle</p>
                <div class="h-px bg-slate-800 my-3"></div>
                <p id="drawer-desc" class="text-xs text-slate-300 leading-relaxed mb-4">Description</p>
                <div id="drawer-meaning" class="bg-slate-800/60 p-3 rounded-xl border border-slate-700/50 text-xs">
                    <span class="font-bold text-indigo-300 block mb-1"><i class="fa-solid fa-orbit"></i> Ý nghĩa vị trí Lagrange:</span>
                    <p id="drawer-meaning-text" class="text-slate-300 leading-normal"></p>
                </div>
            </div>
        </div>

    </div>

    <script>
        const characters = {
            arisu: { id: 'arisu', name: 'Yamabuki Arisu', role: 'Nam chính / Quản lý CLB', icon: 'fa-user-astronaut', color: 'from-blue-600 to-indigo-600', borderColor: 'border-blue-500/50', desc: 'Học sinh có khả năng cảm nhận giọng nói đặc biệt. Người dẫn dắt, định hình và tạo lực hấp dẫn gắn kết các cô gái.' },
            shinobu: { id: 'shinobu', name: 'Uzuki Shinobu', role: 'Phát thanh viên', icon: 'fa-radio', color: 'from-pink-500 to-rose-600', borderColor: 'border-pink-500/50', desc: 'Phó chủ tịch hội học sinh. Giọng nói dịu dàng, ấm áp, gánh vác trách nhiệm hậu phương vững chắc.' },
            iko: { id: 'iko', name: 'Kirino Iko', role: 'VTuber Streamer', icon: 'fa-headset', color: 'from-emerald-500 to-teal-600', borderColor: 'border-emerald-500/50', desc: 'VTuber rụt rè nhưng kiên trì. Dùng chính sự vụng về và chân thật để kết nối trái tim người hâm mộ.' },
            nene: { id: 'nene', name: 'Himekawa Nene', role: 'Lồng tiếng (VA)', icon: 'fa-microphone', color: 'from-purple-500 to-violet-600', borderColor: 'border-purple-500/50', desc: 'Tsundere bướng bỉnh với khả năng biểu cảm giọng nói chân thật. Đang chuyển mình mạnh mẽ trong sự nghiệp VA.' },
            rikka: { id: 'rikka', name: 'Inohana Rikka', role: 'Ca sĩ (Singer)', icon: 'fa-music', color: 'from-amber-500 to-orange-600', borderColor: 'border-amber-500/50', desc: 'Sở hữu giọng hát truyền cảm thiên bẩm. Trưởng thành từ tổn thương để tự do cất lên tiếng hát.' },
            none: { id: 'none', name: 'Trống (Trôi dạt)', role: 'Chưa có ai đứng', icon: 'fa-ban', color: 'from-slate-600 to-slate-800', borderColor: 'border-slate-700', desc: 'Điểm cân bằng này hiện chưa có nhân vật nào chiếm giữ.' }
        };

        const sunNode = { name: 'Mặt Trời (Sun)', role: 'Thần tinh trung tâm', icon: 'fa-sun', color: 'from-amber-500 to-orange-500', desc: 'Nguồn năng lượng chính chiếu sáng toàn bộ hệ hành tinh.', pointName: 'SUN', meaning: 'Trung tâm hệ Mặt Trời.' };
        const earthNode = { name: 'Trái Đất (Earth)', role: 'Trọng tâm hấp dẫn', icon: 'fa-globe', color: 'from-blue-600 to-cyan-500', desc: 'Trung tâm lực hấp dẫn chính của hệ thống quỹ đạo.', pointName: 'EARTH', meaning: 'Trọng tâm duy trì sự ổn định của cả 5 điểm Lagrange.' };
        const moonNode = { name: 'Mặt Trăng (Moon)', role: 'Vệ tinh tự nhiên', icon: 'fa-moon', color: 'from-fuchsia-600 to-pink-600', desc: 'Thiên thể xoay quanh Trái Đất, tạo nên các điểm cân bằng lực hấp dẫn Lagrange.', pointName: 'MOON', meaning: 'Vật thể phối hợp tạo nên các điểm cân bằng Lagrange đặc biệt cùng với Trái Đất.' };

        const lagrangeMeanings = {
            L1: 'Nằm giữa Earth & Moon. Vị trí giao thoa, chịu lực kéo căng thẳng nhất và có mật độ tương tác dày đặc.',
            L2: 'Nằm phía sau Moon. Vị trí khuất bóng, chứa đựng những góc khuất bí ẩn hoặc cảm xúc ẩn giấu.',
            L3: 'Nằm đối lập trực tiếp qua Earth. Vị trí cân bằng từ xa, độc lập giữ vai trò đối trọng lớn.',
            L4: 'Điểm tiên phong dẫn đầu (+60°). Vị trí cực kỳ ổn định, đang có thế tiến triển rất tốt.',
            L5: 'Điểm hậu phương theo sau (-60°). Vị trí bền bỉ, âm thầm tích lũy và sẵn sàng bứt phá.'
        };

        // MẶC ĐỊNH MẮC ĐỊNH VỊ TRÍ GỐC (Master State)
        const defaultAssignments = {
            L1: 'shinobu',
            L2: 'iko',
            L3: 'arisu',
            L4: 'nene',
            L5: 'rikka'
        };

        // Trạng thái tạm thời của phiên làm việc người xem
        let currentAssignments = JSON.parse(JSON.stringify(defaultAssignments));
        let selectedCharId = null;
        let draggedCharId = null;

        function renderCharTray() {
            const tray = document.getElementById('char-tray');
            let html = `<span class="text-[10px] font-bold text-slate-400 px-0.5"><i class="fa-solid fa-hand-pointer text-pink-400"></i> Chọn:</span>`;
            
            Object.keys(characters).forEach(id => {
                if(id === 'none') return;
                const char = characters[id];
                const isSelected = selectedCharId === id;
                html += `
                    <div draggable="true" 
                         ondragstart="handleDragStart(event, '${id}')" 
                         onclick="selectCharClick(event, '${id}')"
                         title="Kéo hoặc bấm chọn ${char.name}"
                         class="char-card px-2 py-1 rounded-xl bg-slate-800 border ${isSelected ? 'border-pink-500 shadow-md shadow-pink-500/30' : 'border-slate-700/80'} flex items-center gap-1">
                        <i class="fa-solid ${char.icon} text-xs ${isSelected ? 'text-pink-300' : 'text-pink-400'}"></i>
                        <span class="text-[11px] font-bold ${isSelected ? 'text-pink-300' : 'text-slate-200'}">${char.name.split(' ')[1] || char.name}</span>
                    </div>
                `;
            });
            tray.innerHTML = html;
        }

        function renderSystem() {
            Object.keys(currentAssignments).forEach(pointKey => {
                const charId = currentAssignments[pointKey];
                const char = characters[charId];
                const container = document.getElementById(pointKey);

                if (!container) return;

                if (charId === 'none') {
                    container.innerHTML = `
                        <div class="w-10 h-10 rounded-full bg-slate-900/80 border border-slate-700 flex items-center justify-center cursor-pointer hover:border-pink-500/50 transition-all">
                            <span class="text-[10px] font-bold text-slate-500">${pointKey}</span>
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div draggable="true" 
                             ondragstart="handleDragStart(event, '${charId}')" 
                             onclick="handleCardClick(event, '${pointKey}', '${charId}')" 
                             class="char-card cursor-grab flex flex-col items-center">
                            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr ${char.color} p-0.5 shadow-lg border ${char.borderColor}">
                                <div class="w-full h-full rounded-[14px] bg-slate-950/80 flex items-center justify-center text-white text-base">
                                    <i class="fa-solid ${char.icon}"></i>
                                </div>
                            </div>
                            <span class="mt-1 bg-slate-900/90 border border-slate-700/80 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow-md whitespace-nowrap">
                                <strong class="text-pink-400 me-1">${pointKey}:</strong>${char.name.split(' ')[1] || char.name}
                            </span>
                        </div>
                    `;
                }
            });
        }

        // Bấm chọn nhân vật từ khay (Hỗ trợ điện thoại)
        function selectCharClick(e, charId) {
            e.stopPropagation();
            if(selectedCharId === charId) {
                selectedCharId = null;
            } else {
                selectedCharId = charId;
            }
            renderCharTray();
        }

        function handlePointClick(targetPoint) {
            if (selectedCharId) {
                moveCharToPoint(selectedCharId, targetPoint);
                selectedCharId = null;
                renderCharTray();
            }
        }

        function handleCardClick(e, pointKey, charId) {
            e.stopPropagation();
            if (selectedCharId) {
                moveCharToPoint(selectedCharId, pointKey);
                selectedCharId = null;
                renderCharTray();
            } else {
                openPointDrawer(pointKey, charId);
            }
        }

        function moveCharToPoint(charId, targetPoint) {
            let sourcePoint = Object.keys(currentAssignments).find(k => currentAssignments[k] === charId);
            if (sourcePoint && sourcePoint !== targetPoint) {
                let existingCharOnTarget = currentAssignments[targetPoint];
                currentAssignments[sourcePoint] = existingCharOnTarget;
                currentAssignments[targetPoint] = charId;
            } else {
                currentAssignments[targetPoint] = charId;
            }
            renderSystem();
        }

        // Drag and Drop
        function handleDragStart(e, charId) {
            draggedCharId = charId;
            e.dataTransfer.setData('text/plain', charId);
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            e.currentTarget.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function handleDrop(e, targetPoint) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            if (!draggedCharId) return;
            moveCharToPoint(draggedCharId, targetPoint);
            draggedCharId = null;
        }

        function resetToDefault() {
            currentAssignments = JSON.parse(JSON.stringify(defaultAssignments));
            selectedCharId = null;
            renderCharTray();
            renderSystem();
        }

        // Drawer
        function openPointDrawer(pointKey, charId) {
            const char = characters[charId];
            document.getElementById('drawer-point').innerText = `ĐIỂM LAGRANGE ${pointKey}`;
            document.getElementById('drawer-title').innerText = char.name;
            document.getElementById('drawer-subtitle').innerText = char.role;
            document.getElementById('drawer-desc').innerText = char.desc;
            document.getElementById('drawer-meaning-text').innerText = lagrangeMeanings[pointKey] || '';

            const iconBox = document.getElementById('drawer-icon');
            iconBox.className = `w-14 h-14 rounded-2xl mb-3 flex items-center justify-center text-xl text-white shadow-lg bg-gradient-to-tr ${char.color}`;
            iconBox.innerHTML = `<i class="fa-solid ${char.icon}"></i>`;

            document.getElementById('drawer-backdrop').classList.remove('hidden');
            document.getElementById('detail-drawer').classList.remove('translate-x-full');
        }

        function openDrawer(node) {
            document.getElementById('drawer-point').innerText = node.pointName;
            document.getElementById('drawer-title').innerText = node.name;
            document.getElementById('drawer-subtitle').innerText = node.role;
            document.getElementById('drawer-desc').innerText = node.desc;
            document.getElementById('drawer-meaning-text').innerText = node.meaning;

            const iconBox = document.getElementById('drawer-icon');
            iconBox.className = `w-14 h-14 rounded-2xl mb-3 flex items-center justify-center text-xl text-white shadow-lg bg-gradient-to-tr ${node.color}`;
            iconBox.innerHTML = `<i class="fa-solid ${node.icon}"></i>`;

            document.getElementById('drawer-backdrop').classList.remove('hidden');
            document.getElementById('detail-drawer').classList.remove('translate-x-full');
        }

        function closeDrawer() {
            document.getElementById('drawer-backdrop').classList.add('hidden');
            document.getElementById('detail-drawer').classList.add('translate-x-full');
        }

        window.addEventListener('load', () => {
            renderCharTray();
            renderSystem();
        });
    </script>
</body>
</html>
